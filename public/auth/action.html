<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Account Actions | ServicePilot</title>
    <meta
      name="description"
      content="Secure ServicePilot email verification and password reset"
    />
    <link
      rel="icon"
      href="/assets/images/servicepilot-logo.png"
    />
    <style>
      :root {
        --bg: #06101d;
        --card: #0d1b2a;
        --card-strong: #101f30;
        --border: rgba(255, 255, 255, 0.08);
        --text: #f8fafc;
        --muted: #94a3b8;
        --quiet: #64748b;
        --blue: #2563eb;
        --blue-soft: #3b82f6;
        --success: #22c55e;
        --warning: #f59e0b;
        --error: #ef4444;
      }

      [hidden] { display: none !important; }
      .secure-form { margin-top: 24px; text-align: left; }
      .secure-form fieldset { border: 0; padding: 0; margin: 0; }
      .secure-form label { display: block; margin: 16px 0 8px; color: var(--text); font-size: 14px; }
      .input-row { display: flex; gap: 8px; }
      .secure-form input { min-width: 0; width: 100%; background: var(--card-strong); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 14px; font: inherit; }
      button { font-family: inherit; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      .secure-form .button { margin-top: 18px; width: 100%; }
      .visibility { border: 1px solid var(--border); border-radius: 10px; background: var(--card-strong); color: var(--text); min-width: 58px; }
      .form-message { color: #fca5a5; line-height: 1.5; font-size: 14px; }
      .status-icon { font-size: 36px; }
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 78% 8%, rgba(37, 99, 235, 0.14), transparent 32%),
          radial-gradient(circle at 12% 86%, rgba(59, 130, 246, 0.09), transparent 34%),
          var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
      }

      .shell {
        width: min(100%, 500px);
      }

      .brand {
        display: grid;
        justify-items: center;
        margin-bottom: 28px;
      }

      .logo-wrap {
        width: 78px;
        height: 78px;
        border-radius: 24px;
        display: grid;
        place-items: center;
        background: rgba(37, 99, 235, 0.15);
        border: 1px solid rgba(59, 130, 246, 0.2);
        margin-bottom: 16px;
      }

      .logo {
        width: 58px;
        height: 58px;
        border-radius: 18px;
        object-fit: cover;
      }

      .brand-name {
        margin: 0;
        font-size: 23px;
        letter-spacing: 0;
        font-weight: 900;
      }

      .brand-name span {
        color: var(--blue-soft);
      }

      .brand-subtitle {
        margin: 6px 0 0;
        color: var(--quiet);
        font-size: 13px;
      }

      .card {
        min-height: 382px;
        border-radius: 22px;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.28);
        padding: 34px 26px 28px;
        text-align: center;
      }

      .status-icon {
        width: 84px;
        height: 84px;
        border-radius: 42px;
        display: grid;
        place-items: center;
        margin: 0 auto 22px;
        background: rgba(37, 99, 235, 0.12);
        color: var(--blue-soft);
      }

      .status-icon.success {
        background: rgba(34, 197, 94, 0.12);
        color: var(--success);
      }

      .status-icon.warning {
        background: rgba(245, 158, 11, 0.12);
        color: var(--warning);
      }

      .status-icon.error {
        background: rgba(239, 68, 68, 0.12);
        color: var(--error);
      }

      h1 {
        margin: 0;
        font-size: clamp(25px, 5vw, 30px);
        line-height: 1.15;
        letter-spacing: 0;
      }

      .message {
        max-width: 360px;
        margin: 16px auto 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .actions {
        display: grid;
        gap: 12px;
        margin-top: 28px;
      }

      .button {
        min-height: 54px;
        border-radius: 13px;
        border: 1px solid transparent;
        display: inline-grid;
        place-items: center;
        padding: 0 18px;
        font-weight: 800;
        font-size: 15px;
        text-decoration: none;
      }

      .button.primary {
        background: var(--blue);
        color: #ffffff;
        box-shadow: 0 14px 30px rgba(37, 99, 235, 0.24);
      }

      .button.secondary {
        color: var(--muted);
        border-color: var(--border);
        background: var(--card-strong);
      }

      .footer {
        margin-top: 22px;
        color: #475569;
        font-size: 12px;
        text-align: center;
      }

      .spinner {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 3px solid rgba(59, 130, 246, 0.22);
        border-top-color: var(--blue-soft);
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-live="polite">
        <div class="brand">
          <div class="logo-wrap">
            <img
              class="logo"
              src="/assets/images/servicepilot-logo.png"
              alt="ServicePilot"
            />
          </div>
          <h2 class="brand-name">SERVICE<span>PILOT</span></h2>
          <p class="brand-subtitle">Field Service Management</p>
        </div>

        <article class="card">
          <div id="statusIcon" class="status-icon">
            <div class="spinner" aria-hidden="true"></div>
          </div>
          <h1 id="title">Checking your secure link...</h1>
          <p id="message" class="message">
            Please wait while we load the secure account action.
          </p>
          <noscript><p>JavaScript is required to complete this secure action. Enable JavaScript and reopen the link from your email.</p></noscript>
          <form id="resetForm" class="secure-form" hidden novalidate>
            <fieldset id="resetFields" disabled>
              <label for="newPassword">New password</label>
              <div class="input-row"><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required aria-describedby="resetHint resetError" /><button id="showPassword" class="visibility" type="button" aria-label="Show or hide new password" aria-pressed="false">Show</button></div>
              <label for="confirmPassword">Confirm new password</label>
              <div class="input-row"><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required aria-describedby="resetError" /><button id="showConfirmation" class="visibility" type="button" aria-label="Show or hide password confirmation" aria-pressed="false">Show</button></div>
              <p id="resetHint" class="message">Use at least 8 characters. Follow any additional account password requirements.</p>
              <p id="resetError" class="form-message" role="alert"></p>
              <button id="resetSubmit" class="button primary" type="submit">Reset Password</button>
            </fieldset>
          </form>
          <button id="retryAction" class="button secondary" type="button" hidden>Retry checking link</button>
          <button id="requestFresh" class="button secondary" type="button" hidden>Request a fresh reset link</button>
          <form id="freshForm" class="secure-form" hidden novalidate>
            <label for="freshEmail">Email address</label>
            <input id="freshEmail" type="email" autocomplete="email" maxlength="254" required />
            <button id="freshSubmit" class="button primary" type="submit">Send Reset Link</button>
            <p id="freshMessage" class="form-message" role="status" aria-live="polite"></p>
          </form>
          <div id="actions" class="actions" hidden>
            <a class="button primary" href="servicepilotmobile://login" id="primaryAction">
              Back to Sign In (Mobile App)
            </a>
            <a class="button secondary" href="/login" id="secondaryAction">
              Web Portal Sign In
            </a>
          </div>
        </article>

        <p class="footer">&copy; ServicePilot</p>
      </section>
    </main>

    <script type="module">
      // Strip sensitive parameters before any external SDK imports. Never report
      // location.search, action codes, passwords, or raw provider errors.
      async function boot() {
        const params = new URLSearchParams(window.location.search);
        const input = { mode: params.get("mode"), code: params.get("oobCode"),
          invalidQuery: params.getAll("mode").length !== 1 || params.getAll("oobCode").length !== 1 };
        window.history.replaceState(null, "", window.location.pathname);
        let active = true, page;
        window.addEventListener("pagehide", () => { active = false; input.code = ""; page?.dispose(); }, { once: true });
        try {
          const [appApi, authApi, controller, config] = await Promise.all([
            import("https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js"),
            import("https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js"),
            import("/auth/action-controller.js"), import("/auth/action-config.js"),
          ]);
          if (!active) return;
          const settings = config.actionConfig;
          const app = appApi.initializeApp(settings.firebase, "servicepilot-email-action");
          const auth = authApi.initializeAuth(app, { persistence: authApi.inMemoryPersistence });
          if (settings.emulatorUrl) {
            if (!settings.firebase.projectId.startsWith("demo-") || !["127.0.0.1", "localhost"].includes(window.location.hostname) ||
                !/^http:\/\/(127\.0\.0\.1|localhost):\d+$/.test(settings.emulatorUrl)) throw new Error("Invalid local configuration");
            authApi.connectAuthEmulator(auth, settings.emulatorUrl, { disableWarnings: true });
          }
          // Fixed reviewed destinations only. continueUrl and URL apiKey are ignored.
          document.getElementById("primaryAction").href = settings.mobileSignIn;
          document.getElementById("secondaryAction").href = settings.webSignIn;
          page = controller.startEmailActionPage({ api: authApi, auth, document, ...input });
          input.code = "";
          await page.ready;
        } catch {
          input.code = "";
          if (!active) return;
          document.getElementById("title").textContent = "Account Action Unavailable";
          document.getElementById("message").textContent = "Check your connection and reopen the link from your email. No password update has been confirmed.";
          document.getElementById("statusIcon").textContent = "!";
          document.getElementById("actions").hidden = false;
        }
      }
      void boot();
    </script>
  </body>
</html>
