<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Verify Email | ServicePilot</title>
    <meta
      name="description"
      content="ServicePilot email verification"
    />
    <link
      rel="icon"
      href="/assets/images/servicepilot-logo.png"
    />
    <style>
      :root {
        --bg: #06101d;
        --card: #0d1b2a;
        --card-strong: #101f30;
        --border: rgba(255, 255, 255, 0.08);
        --text: #f8fafc;
        --muted: #94a3b8;
        --quiet: #64748b;
        --blue: #2563eb;
        --blue-soft: #3b82f6;
        --success: #22c55e;
        --warning: #f59e0b;
        --error: #ef4444;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 78% 8%, rgba(37, 99, 235, 0.14), transparent 32%),
          radial-gradient(circle at 12% 86%, rgba(59, 130, 246, 0.09), transparent 34%),
          var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
      }

      .shell {
        width: min(100%, 500px);
      }

      .brand {
        display: grid;
        justify-items: center;
        margin-bottom: 28px;
      }

      .logo-wrap {
        width: 78px;
        height: 78px;
        border-radius: 24px;
        display: grid;
        place-items: center;
        background: rgba(37, 99, 235, 0.15);
        border: 1px solid rgba(59, 130, 246, 0.2);
        margin-bottom: 16px;
      }

      .logo {
        width: 58px;
        height: 58px;
        border-radius: 18px;
        object-fit: cover;
      }

      .brand-name {
        margin: 0;
        font-size: 23px;
        letter-spacing: 0;
        font-weight: 900;
      }

      .brand-name span {
        color: var(--blue-soft);
      }

      .brand-subtitle {
        margin: 6px 0 0;
        color: var(--quiet);
        font-size: 13px;
      }

      .card {
        min-height: 382px;
        border-radius: 22px;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.28);
        padding: 34px 26px 28px;
        text-align: center;
      }

      .status-icon {
        width: 84px;
        height: 84px;
        border-radius: 42px;
        display: grid;
        place-items: center;
        margin: 0 auto 22px;
        background: rgba(37, 99, 235, 0.12);
        color: var(--blue-soft);
      }

      .status-icon.success {
        background: rgba(34, 197, 94, 0.12);
        color: var(--success);
      }

      .status-icon.warning {
        background: rgba(245, 158, 11, 0.12);
        color: var(--warning);
      }

      .status-icon.error {
        background: rgba(239, 68, 68, 0.12);
        color: var(--error);
      }

      h1 {
        margin: 0;
        font-size: clamp(25px, 5vw, 30px);
        line-height: 1.15;
        letter-spacing: 0;
      }

      .message {
        max-width: 360px;
        margin: 16px auto 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .actions {
        display: grid;
        gap: 12px;
        margin-top: 28px;
      }

      .button {
        min-height: 54px;
        border-radius: 13px;
        border: 1px solid transparent;
        display: inline-grid;
        place-items: center;
        padding: 0 18px;
        font-weight: 800;
        font-size: 15px;
        text-decoration: none;
      }

      .button.primary {
        background: var(--blue);
        color: #ffffff;
        box-shadow: 0 14px 30px rgba(37, 99, 235, 0.24);
      }

      .button.secondary {
        color: var(--muted);
        border-color: var(--border);
        background: var(--card-strong);
      }

      .footer {
        margin-top: 22px;
        color: #475569;
        font-size: 12px;
        text-align: center;
      }

      .spinner {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 3px solid rgba(59, 130, 246, 0.22);
        border-top-color: var(--blue-soft);
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-live="polite">
        <div class="brand">
          <div class="logo-wrap">
            <img
              class="logo"
              src="/assets/images/servicepilot-logo.png"
              alt="ServicePilot"
            />
          </div>
          <h2 class="brand-name">SERVICE<span>PILOT</span></h2>
          <p class="brand-subtitle">Field Service Management</p>
        </div>

        <article class="card">
          <div id="statusIcon" class="status-icon">
            <div class="spinner" aria-hidden="true"></div>
          </div>
          <h1 id="title">Verifying your email...</h1>
          <p id="message" class="message">
            Please wait a moment while we verify your ServicePilot account.
          </p>
          <div id="actions" class="actions" hidden>
            <a class="button primary" href="/" id="primaryAction">
              Open ServicePilot
            </a>
            <a class="button secondary" href="/" id="secondaryAction">
              Back to Sign In
            </a>
          </div>
        </article>

        <p class="footer">&copy; ServicePilot</p>
      </section>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
      import {
        applyActionCode,
        getAuth,
      } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAKPlFn0eosrpqD0v8FxAfk-NsgONd51i4",
        authDomain: "servicepilot-756d9.firebaseapp.com",
        projectId: "servicepilot-756d9",
        storageBucket: "servicepilot-756d9.firebasestorage.app",
        messagingSenderId: "869400470316",
        appId: "1:869400470316:web:3ccdf35ad3cbb368698289",
      };

      const stateContent = {
        success: {
          icon: "check",
          tone: "success",
          title: "Email Verified",
          message:
            "Your ServicePilot email has been verified successfully. You can now return to the ServicePilot app and sign in.",
        },
        alreadyUsed: {
          icon: "check",
          tone: "warning",
          title: "Email Already Verified",
          message:
            "This verification link has already been used or the account is already verified. You can return to ServicePilot and sign in.",
        },
        expired: {
          icon: "alert",
          tone: "warning",
          title: "Verification Link Expired",
          message:
            "This verification link is no longer valid. Return to ServicePilot and request a new verification email.",
        },
        invalid: {
          icon: "alert",
          tone: "error",
          title: "Invalid Verification Link",
          message:
            "This verification link is missing required information. Return to ServicePilot and request a new verification email.",
        },
        unsupported: {
          icon: "alert",
          tone: "warning",
          title: "Unsupported Action",
          message:
            "This ServicePilot page only handles email verification links.",
        },
        error: {
          icon: "alert",
          tone: "error",
          title: "Unable to Verify Email",
          message:
            "We couldn't verify your email right now. Return to ServicePilot and request a new verification email.",
        },
      };

      const statusIcon = document.getElementById("statusIcon");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const actions = document.getElementById("actions");
      const primaryAction = document.getElementById("primaryAction");
      const secondaryAction = document.getElementById("secondaryAction");

      function iconMarkup(name) {
        if (name === "check") {
          return `
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          `;
        }

        return `
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 9v4" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
            <path d="M12 17h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M10.3 4.4 2.7 18a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 4.4a2 2 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        `;
      }

      function renderState(key) {
        const state = stateContent[key] ?? stateContent.error;

        statusIcon.className = `status-icon ${state.tone}`;
        statusIcon.innerHTML = iconMarkup(state.icon);
        title.textContent = state.title;
        message.textContent = state.message;
        actions.hidden = false;
        primaryAction.textContent = "Return to ServicePilot App";
        primaryAction.removeAttribute("target");
        primaryAction.href = "/";
        secondaryAction.textContent = "Back to Sign In";
        secondaryAction.href = "/";
      }

      async function verifyEmailAction() {
        const params = new URLSearchParams(window.location.search);
        const mode = params.get("mode");
        const oobCode = params.get("oobCode");
        const continueUrl = params.get("continueUrl");
        const lang = params.get("lang");

        if (lang) {
          document.documentElement.lang = lang;
        }

        if (mode !== "verifyEmail") {
          renderState("unsupported");
          return;
        }

        if (!oobCode) {
          renderState("invalid");
          return;
        }

        try {
          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);

          await applyActionCode(auth, oobCode);
          void continueUrl;
          renderState("success");
        } catch (error) {
          const code = error?.code || "";

          if (code === "auth/expired-action-code") {
            renderState("expired");
            return;
          }

          if (code === "auth/invalid-action-code") {
            renderState("alreadyUsed");
            return;
          }

          renderState("error");
        }
      }

      verifyEmailAction();
    </script>
  </body>
</html>
