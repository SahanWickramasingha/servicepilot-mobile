<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ServicePilot</title>
    <meta
      name="description"
      content="Return to the ServicePilot mobile app."
    />
    <link rel="icon" href="/assets/images/servicepilot-logo.png" />
    <style>
      :root {
        --bg: #06101d;
        --card: #0d1b2a;
        --border: rgba(255, 255, 255, 0.08);
        --text: #f8fafc;
        --muted: #94a3b8;
        --blue: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px 18px;
        background:
          radial-gradient(circle at 78% 8%, rgba(37, 99, 235, 0.14), transparent 32%),
          var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .card {
        width: min(100%, 460px);
        border-radius: 22px;
        border: 1px solid var(--border);
        background: var(--card);
        padding: 34px 26px;
        text-align: center;
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.28);
      }

      img {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        object-fit: cover;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }

      h1 span {
        color: #3b82f6;
      }

      p {
        margin: 14px auto 0;
        max-width: 330px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        margin-top: 26px;
        padding: 0 18px;
        border-radius: 12px;
        background: rgba(37, 99, 235, 0.16);
        color: #bfdbfe;
        font-size: 14px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/assets/images/servicepilot-logo.png" alt="ServicePilot" />
      <h1>SERVICE<span>PILOT</span></h1>
      <p>
        Return to the ServicePilot mobile app and continue from the verification
        screen.
      </p>
      <div class="pill">Open the ServicePilot app</div>
    </main>
  </body>
</html>
